services:
  db:
    image: mariadb:latest
    ports:
      - "3390:3306"
    environment:
      MARIADB_ROOT_PASSWORD: kilroy
      MARIADB_DATABASE: Bluetti_AC200MAX
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
